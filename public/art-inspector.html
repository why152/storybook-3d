<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Illustrated story · Layer Inspector</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#f9f3ec;background:#11131b}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}
header{padding:22px max(22px,4vw);display:flex;gap:20px;align-items:baseline;justify-content:space-between;border-bottom:1px solid #ffffff22}
h1{font-size:22px;letter-spacing:-.7px;margin:0}header small{color:#a8a7b4}
main{padding:25px max(15px,4vw) 45px;display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,320px);gap:28px;flex:1;align-items:start}
.viewport{min-height:0;display:grid;place-items:center;padding:46px 20px 80px;perspective:1250px;background:radial-gradient(ellipse at center,#303342 0,#12151d 60%);border:1px solid #ffffff1c;border-radius:12px}
.card{width:min(100%,1080px);aspect-ratio:12/7;position:relative;transform-style:preserve-3d;transition:transform .35s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;transform-style:preserve-3d;border-radius:8px}
.panel{background:#20222e;border:1px solid #ffffff24;border-radius:12px;padding:23px}
fieldset{border:0;margin:0;padding:0}legend{font-weight:700;font-size:14px;margin-bottom:13px}
input[type=range]{width:100%;accent-color:#e6a883}
.control{display:flex;justify-content:space-between;font-size:13px;color:#cbc4bf;margin:13px 0 7px}
.layer{display:flex;gap:11px;align-items:center;justify-content:space-between;font-size:13px;line-height:2.4}
.layer span{color:#a5a4af;font-size:11px}
.layer input{accent-color:#e6a883}
button{border:1px solid #8b817e;background:transparent;border-radius:5px;color:#f5dec9;padding:10px 14px;cursor:pointer;margin:7px 5px 0 0}
button:hover{background:#ffffff1c}p{color:#aaa8b5;font-size:12px;line-height:1.8}
footer{padding:14px 4vw;color:#777987;font-size:11px;border-top:1px solid #ffffff18}
@media(max-width:850px){main{grid-template-columns:1fr}.viewport{padding:22px 10px 45px}}
</style></head><body>
<header><h1><span id="scene-name">HELLO</span> <span style="color:#e5a58a">/ six-layer art inspector</span></h1><small>1200 × 700 · Original SVG assets · Z-depth preview</small></header>
<main>
  <div class="viewport"><div id="card" class="card" aria-label="六层美术合成预览"></div></div>
  <aside class="panel">
    <label for="scene" style="display:block;font-weight:700;font-size:14px;margin-bottom:9px">选择章节</label><select id="scene" style="background:#11131b;color:#f5dec9;border:1px solid #8b817e;padding:10px;width:100%;margin-bottom:22px"><option value="hello">HELLO / 相遇</option><option value="grow">GROW / 成长</option><option value="together">TOGETHER / 同行</option><option value="dream">DREAM / 远方</option><option value="wish">WISH / 祝福</option></select>
    <fieldset><legend>观察角度与分层</legend>
      <div class="control"><label for="angle">水平旋转</label><output id="angleText">0°</output></div>
      <input id="angle" type="range" min="-68" max="68" value="0"/>
      <div class="control"><label for="separation">图层展开距离</label><output id="sepText">0%</output></div>
      <input id="separation" type="range" min="0" max="100" value="0"/>
    </fieldset>
    <fieldset style="margin-top:23px"><legend>图层（从后到前）</legend><div id="layers"></div></fieldset>
    <button id="reset">恢复合成</button><button id="fan">展开全部图层</button>
    <p>调节角度可以检查真实的前后景关系；“展开图层”会夸大间距，帮助确认六张文件确实是独立透明资产。它是视觉检查器，不是最终翻页引擎。</p>
  </aside>
</main>
<footer>Original art only · No customer data · No borrowed source illustration</footer>
<script>
const sceneParam=new URLSearchParams(location.search).get('scene');
const scene=['hello','grow','together','dream','wish'].includes(sceneParam)?sceneParam:'hello';
document.querySelector('#scene-name').textContent=scene.toUpperCase();
document.querySelector('#scene').value=scene;
document.querySelector('#scene').addEventListener('change',e=>{location.search='?scene='+encodeURIComponent(e.target.value)});
const files=[
 {name:"background",z:0,description:"远景 / 天空"},
 {name:"midground",z:11,description:"建筑 / 树"},
 {name:"lettering",z:27,description:"章节大字 / 标题"},
 {name:"characters",z:48,description:"兔子 / 狐狸"},
 {name:"foreground",z:68,description:"前景 / 花"},
 {name:"effects",z:78,description:"蝴蝶 / 纸屑"}
];
const card=document.querySelector("#card"),list=document.querySelector("#layers");
const angle=document.querySelector("#angle"),separation=document.querySelector("#separation");
for(const layer of files){
  const img=document.createElement("img");img.src="/assets/"+scene+"/"+layer.name+".svg";img.alt=layer.description;img.dataset.name=layer.name;card.append(img);layer.element=img;
  const row=document.createElement("label");row.className="layer";
  const text=document.createElement("span");text.textContent=layer.name+" · "+layer.description+"  (Z "+layer.z+")";
  const check=document.createElement("input");check.type="checkbox";check.checked=true;check.addEventListener("change",()=>{img.style.display=check.checked?"block":"none";});
  row.append(text,check);list.append(row);layer.checkbox=check;
}
function render(){
  const degrees=Number(angle.value),spread=Number(separation.value);
  card.style.transform="rotateY("+degrees+"deg)";
  for(const layer of files)layer.element.style.transform="translate3d(0,"+(-layer.z*spread/100*.36)+"px,"+(layer.z*(1+spread/100*4))+"px)";
  document.querySelector("#angleText").textContent=degrees+"°";
  document.querySelector("#sepText").textContent=spread+"%";
}
angle.addEventListener("input",render);separation.addEventListener("input",render);
document.querySelector("#reset").onclick=()=>{angle.value=0;separation.value=0;files.forEach(x=>{x.checkbox.checked=true;x.element.style.display="block";});render();};
document.querySelector("#fan").onclick=()=>{angle.value=35;separation.value=100;render();};
render();
</script></body></html>
